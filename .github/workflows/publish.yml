name: Build and Push Docker Image

# Trigger the workflow on push to main branch
on:
  push:
    branches:
      - master

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
     
# Permissions required for GitHub Container Registry access and Git operations
permissions:
  contents: write
  packages: write

# Define the build and push job
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Authenticate with GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Build Docker image and push to GHCR
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # Step 4: Update deployment.yaml with new image tag
      - name: Update Deployment Image Tag
        run: |
          IMAGE_TAG="${{ github.sha }}"
          sed -i "s|image: ghcr.io/.*/hello-world:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|" k8s/deployment.yaml
          cat k8s/deployment.yaml

      # Step 5: Commit and push changes back to repository
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push origin master