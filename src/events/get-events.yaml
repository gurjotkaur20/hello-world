# GET Events

http.get./get-name:
  fn: get.get_name
  authn: false
  params:
    - name: firstName
      in: query
      required: true
      schema:
        type: string
    - name: lastName
      in: query
      required: true
      schema:
        type: string
  responses:
    200:
      content:
        application/json:
          schema:
            type: object

http.get./get-age:
  fn: get.get_age
  authn: false
  params:
    - name: birthYear
      in: query
      required: true
      schema:
        type: integer
  responses:
    200:
      content:
        application/json:
          schema:
            type: object

