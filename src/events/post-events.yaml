# POST Events

http.post./post-story:
  fn: post.post_story
  authn: false
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title:
              type: string
            content:
              type: string
  responses:
    200:
      content:
        application/json:
          schema:
            type: object

